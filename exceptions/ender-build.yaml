apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: ender-build
  namespace: kyverno
  annotations:
    meru.clockmost.com/reason: >-
      Ender's build namespace (D32). Its job pods run rootless BuildKit, which needs privilege escalation,
      SETUID/SETGID, SELinux container_engine_t and a custom seccomp profile - Pod Security "baseline", not
      "restricted". Its check pods and the app (namespace ender) stay restricted. Every other rule still applies.
      Written by Shikigami (D82).
spec:
  policyRefs:
    - name: require-restricted-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: ender-build-namespace-only
      expression: "object.metadata.name == 'ender-build'"
