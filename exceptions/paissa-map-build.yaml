apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: paissa-map-build
  namespace: kyverno
  annotations:
    meru.clockmost.com/reason: >-
      Paissa-map's build namespace (D32). Its job pods run rootless BuildKit, which needs privilege escalation,
      SETUID/SETGID, SELinux container_engine_t and a custom seccomp profile - Pod Security "baseline", not
      "restricted". Its check pods and the app (namespace paissa-map) stay restricted. Every other rule still applies.
      Written by Shikigami (D82).
spec:
  policyRefs:
    - name: require-restricted-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: paissa-map-build-namespace-only
      expression: "object.metadata.name == 'paissa-map-build'"
