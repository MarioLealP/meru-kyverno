# Which signing key each Meru app's images must carry (D59, signatures A): namespace -> the app's cosign public key.
# The rule signatures/meru-signed.yaml looks the key up by the pod's namespace. Adding an app's line here = trusting
# its builds; the private half lives in OpenBao (apps/meru/<app>-build/build), where only that app's builds read it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: meru-signing-keys
  namespace: kyverno
