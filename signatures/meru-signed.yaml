# Compliance rule 8 for every Meru app (D31, D59 signatures A): each image a pod in an app's namespace runs must carry
# a cosign signature from that app's own key, looked up by namespace in keys/meru-signing-keys.yaml. A namespace with
# no line there runs nothing. Anything else - upstream images included - is refused.
# Scope: namespaces with a meru.clockmost.com/app label, except the <app>-build ones (their runner and BuildKit are
# upstream images; Meru/sindri).
# One exception, and only by exact digest: the pods CNPG makes for an app's database (D58), whose images are CNPG's own
# (operator as init container + the Postgres operand). Upgrading CNPG or Postgres means updating the digests here - on
# purpose, so nothing else slips in under that name. A pod mixing them with anything else is checked as usual.
# The second operand is TensorChord's CNPG build with VectorChord + pgvector, for immich's vector search (2026-11-13).
# CNPG's plain Postgres 18 (2026-11-14): new clusters start on 18 (zabbix first); the 16.15 ones move over time.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: meru-signed
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: meru.clockmost.com/app, operator: Exists }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: not-a-build-namespace
      expression: "!namespaceObject.metadata.name.endsWith('-build')"
    - name: not-cnpg-database-pods
      expression: >-
        !(object.spec.containers.all(c, c.image in
           ['ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07',
           'ghcr.io/cloudnative-pg/postgresql:16.15-202610260820-minimal-trixie@sha256:fc189febbe8c683dcf7399b93d25af3ad7a4d74c061875db300c41f0ad85f77a',
           'ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93',
           'ghcr.io/cloudnative-pg/postgresql:18.7-202611122305-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1']) &&
          object.spec.?initContainers.orValue([]).all(c, c.image in
           ['ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07',
           'ghcr.io/cloudnative-pg/postgresql:16.15-202610260820-minimal-trixie@sha256:fc189febbe8c683dcf7399b93d25af3ad7a4d74c061875db300c41f0ad85f77a',
           'ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93',
           'ghcr.io/cloudnative-pg/postgresql:18.7-202611122305-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1']))
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchImageReferences:
    - glob: "*"
  credentials:
    allowInsecureRegistry: true # Zot is plain http inside the cluster (zot.clockmost.com -> its ClusterIP)
  variables:
    - name: keys
      expression: "resource.Get('v1', 'configmaps', 'kyverno', 'meru-signing-keys').data"
  attestors:
    - name: app
      cosign:
        key:
          expression: "resource.Get('v1', 'configmaps', 'kyverno', 'meru-signing-keys').data[namespaceObject.metadata.name]"
        ctlog:
          # Our signatures never go to Sigstore's public transparency log (D31: no record of every build).
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
    - expression: "namespaceObject.metadata.name in variables.keys"
      messageExpression: "'No signing key is listed for namespace ' + namespaceObject.metadata.name + ' (Meru/kyverno keys/meru-signing-keys.yaml), so nothing may run here.'"
    - expression: "images.containers.map(image, verifyImageSignatures(image, [attestors.app])).all(e, e > 0)"
      messageExpression: "'Images in namespace ' + namespaceObject.metadata.name + ' must be signed with its app key (Meru/kyverno keys/meru-signing-keys.yaml).'"
