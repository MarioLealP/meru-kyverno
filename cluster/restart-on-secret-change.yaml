apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: restart-on-secret-change
  annotations:
    policies.kyverno.io/description: >-
      D72 - when a Secret's data changes in a Meru namespace (ESO rotated a value, cert-manager renewed a
      certificate), every Deployment there that uses it rolls: its pod template gets an annotation naming the Secret
      version, so pods pick up the new value by a normal rolling restart. Most apps (the Temporal UI, the Python
      SDK) don't reload files or env vars themselves; one that does (Temporal's server) is annotated
      meru.clockmost.com/reloads-secrets: "true" and skipped. Best effort: if Kyverno is down, Secrets still update.
spec:
  failurePolicy: Ignore # never block a Secret update over a restart
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [secrets]
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: meru
  matchConditions:
    - name: data-changed # metadata-only updates (labels, ESO's refresh stamps) restart nothing
      expression: "object.?data.orValue({}) != oldObject.?data.orValue({})"
  evaluation:
    mutateExisting:
      enabled: true
    background:
      enabled: false # no scan of existing Secrets for reports: that would need read access to every Secret
  variables:
    - name: namespace
      expression: request.object.metadata.namespace
    - name: secret
      expression: request.object.metadata.name
    - name: version
      expression: request.object.metadata.resourceVersion
  targetMatchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [deployments]
  targetMatchConditions:
    - name: same-namespace
      expression: object.metadata.namespace == variables.namespace
    - name: not-self-reloading # the app re-reads its files itself (Temporal's server): a restart would be churn
      expression: object.metadata.?annotations[?'meru.clockmost.com/reloads-secrets'].orValue('') != 'true'
    - name: uses-the-secret # as a volume, envFrom or a single env var
      expression: >-
        object.spec.template.spec.?volumes.orValue([]).exists(v, v.?secret.secretName.orValue('') == variables.secret) ||
        object.spec.template.spec.containers.exists(c,
          c.?envFrom.orValue([]).exists(e, e.?secretRef.name.orValue('') == variables.secret) ||
          c.?env.orValue([]).exists(e, e.?valueFrom.secretKeyRef.name.orValue('') == variables.secret))
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                metadata: Object.spec.template.metadata{
                  annotations: {"meru.clockmost.com/secret-changed": variables.secret + "@" + variables.version}
                }
              }
            }
          }
